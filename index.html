<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LGD Paris · Pilotage des excursions</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7FAF9; --ink:#15302B; --muted:#4E6B65; --line:#D8E3E0;
  --brand:#147566; --brand-ink:#FFFFFF; --brand-soft:#E2F0EC;
  --warn:#8A5200; --warn-soft:#FCEFD9; --risk:#A3352A; --risk-soft:#FAE5E2;
  --seat-empty:#DCE6E3; --seat-full:#147566; --seat-line:#15302B;
  --shadow: 0 1px 2px rgba(21,48,43,.06), 0 4px 16px rgba(21,48,43,.05);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1916; --surface:#15221F; --surface-2:#1A2925; --ink:#E4EEEB; --muted:#9BB4AE; --line:#2B3C38;
    --brand:#46B8A5; --brand-ink:#06201B; --brand-soft:#173430;
    --warn:#F2B661; --warn-soft:#33270F; --risk:#F2918A; --risk-soft:#3A1E1B;
    --seat-empty:#2B3C38; --seat-full:#46B8A5; --seat-line:#E4EEEB;
    --shadow: none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1916; --surface:#15221F; --surface-2:#1A2925; --ink:#E4EEEB; --muted:#9BB4AE; --line:#2B3C38;
  --brand:#46B8A5; --brand-ink:#06201B; --brand-soft:#173430;
  --warn:#F2B661; --warn-soft:#33270F; --risk:#F2918A; --risk-soft:#3A1E1B;
  --seat-empty:#2B3C38; --seat-full:#46B8A5; --seat-line:#E4EEEB;
  --shadow: none;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:15px; line-height:1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea{ font:inherit; color:inherit; }
a{ color:var(--brand); }
:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; border-radius:6px; }

.app{ display:flex; flex-wrap:wrap; min-height:100vh; }
.side{ flex:1 1 210px; max-width:100%; background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px; }
.main{ flex:999 1 620px; min-width:0; padding:24px clamp(16px,3vw,36px) 48px; }
.brandbox{ padding:0 8px; }
.logo{ display:block; max-width:160px; max-height:64px; background:#FFFFFF; border-radius:8px; padding:4px 6px; }
.brandmark[hidden]{ display:none; }
.brandmark{ display:flex; align-items:baseline; gap:6px; }
.brandmark b{ font-size:22px; font-weight:700; color:var(--brand); letter-spacing:-.5px; }
.brandmark span{ font-weight:600; letter-spacing:2px; font-size:13px; }
.brandsub{ padding:0 8px; margin-top:-14px; font-size:13px; color:var(--muted); }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ text-align:left; border:0; background:transparent; padding:10px 12px; border-radius:8px; font-weight:500; cursor:pointer; min-height:44px; display:flex; align-items:center; gap:10px; }
.nav button:hover{ background:var(--surface-2); }
.nav button[aria-current="page"]{ background:var(--brand-soft); color:var(--brand); font-weight:600; }
.nav svg{ flex-shrink:0; }
.sidefoot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); padding:0 8px; }
.linkbtn{ background:none; border:0; padding:6px 0; color:var(--brand); cursor:pointer; text-align:left; font-weight:500; text-decoration:underline; text-underline-offset:3px; min-height:32px; }
@media (max-width: 760px){
  .side{ border-right:0; border-bottom:1px solid var(--line); padding:12px; gap:10px; }
  .brandsub{ display:none; }
  .nav{ flex-direction:row; flex-wrap:wrap; }
  .nav button{ flex:1 1 auto; justify-content:center; padding:8px 10px; }
  .sidefoot{ flex-direction:row; flex-wrap:wrap; gap:14px; margin-top:0; }
}

h1{ font-size:clamp(24px,2.6vw,30px); line-height:1.2; margin:0; font-weight:700; letter-spacing:-.4px; }
h2{ font-size:18px; margin:0; font-weight:600; }
h3{ font-size:15px; margin:0; font-weight:600; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:20px; }
.head p{ margin:4px 0 0; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-weight:600; cursor:pointer; }
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.danger{ color:var(--risk); }
.btn.small{ min-height:36px; padding:0 12px; font-size:14px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn[aria-pressed="true"]{ background:var(--brand-soft); color:var(--brand); border-color:var(--brand); }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.pad{ padding:18px 20px; }

.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px; }
.kpi{ padding:14px 16px; }
.kpi .v{ font-size:22px; font-weight:700; letter-spacing:-.3px; }
.kpi .l{ font-size:13px; color:var(--muted); }

.deps{ display:flex; flex-direction:column; gap:10px; }
.dep{ display:grid; grid-template-columns: 92px minmax(0,1fr) auto; gap:16px; align-items:center; padding:14px 18px; width:100%; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.dep:hover{ border-color:var(--brand); }
.dep .date{ display:flex; flex-direction:column; line-height:1.15; }
.dep .date .d{ font-size:26px; font-weight:700; }
.dep .date .m{ font-size:13px; color:var(--muted); text-transform:capitalize; }
.dep .mid{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.dep .title{ font-weight:600; font-size:16px; }
.dep .meta{ font-size:13px; color:var(--muted); }
.dep .right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; text-align:right; }
.dep .res{ font-weight:700; font-size:16px; }
@media (max-width: 620px){
  .dep{ grid-template-columns: 70px minmax(0,1fr); }
  .dep .right{ grid-column: 1 / -1; flex-direction:row; justify-content:space-between; align-items:center; }
}

.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; }
.pill.ok{ background:var(--brand-soft); color:var(--brand); }
.pill.warn{ background:var(--warn-soft); color:var(--warn); }
.pill.risk{ background:var(--risk-soft); color:var(--risk); }
.pill.neutral{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
.tag{ font-size:11px; font-weight:700; letter-spacing:.5px; padding:2px 6px; border-radius:4px; background:var(--warn-soft); color:var(--warn); }

.seats{ display:grid; gap:2px; width:100%; }
.seat{ height:12px; border-radius:2px; background:var(--seat-empty); position:relative; }
.seat.full{ background:var(--seat-full); }
.seat.be::after{ content:""; position:absolute; top:-5px; bottom:-5px; right:-2px; width:2px; background:var(--seat-line); border-radius:1px; }
.seats.big{ grid-template-columns:repeat(auto-fill, minmax(22px,1fr)); gap:5px; }
.seats.big .seat{ height:28px; border-radius:5px; }
.seats.big .seat.be::after{ top:-4px; bottom:-4px; right:-4px; width:3px; }
.legend{ display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted); margin-top:10px; }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:6px; }

.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-top:16px; }
.lines{ display:flex; flex-direction:column; }
.line{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); }
.line > span:last-child{ text-align:right; }
.line:last-child{ border-bottom:0; }
.line.total{ font-weight:700; border-top:1px solid var(--ink); border-bottom:0; margin-top:4px; padding-top:10px; }
.pos{ color:var(--brand); }
.neg{ color:var(--risk); }
.note{ padding:12px 14px; border-radius:10px; font-size:14px; }
.note.warn{ background:var(--warn-soft); color:var(--warn); }
.note.risk{ background:var(--risk-soft); color:var(--risk); }
.note.ok{ background:var(--brand-soft); color:var(--brand); }

.stops{ display:flex; flex-direction:column; gap:0; }
.stop{ display:grid; grid-template-columns: 64px 18px minmax(0,1fr) auto; gap:10px; align-items:start; padding:8px 0; }
.stop .t{ font-weight:700; font-size:16px; }
.stop .dot{ width:12px; height:12px; border-radius:50%; border:3px solid var(--brand); background:var(--surface); margin-top:5px; position:relative; }
.stop:not(:last-child) .dot::after{ content:""; position:absolute; left:50%; top:9px; width:2px; height:44px; background:var(--line); transform:translateX(-50%); }
.stop .n{ font-weight:600; }
.stop .a{ font-size:13px; color:var(--muted); }
.stop .c{ font-weight:600; white-space:nowrap; }

.tablewrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; }
th{ text-align:left; font-weight:600; color:var(--muted); font-size:13px; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
td{ padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:0; }
tr.group td{ background:var(--surface-2); font-weight:600; font-size:13px; color:var(--muted); padding:8px 12px; }
td.num, th.num{ text-align:right; white-space:nowrap; }
.empty{ padding:36px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
.empty p{ margin:0; max-width:460px; }

.filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.filters input, .filters select{ min-height:42px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); max-width:100%; }
.filters input{ flex:1 1 220px; }

dialog{ border:0; padding:0; border-radius:16px; background:var(--surface); color:var(--ink); width:min(680px, calc(100vw - 24px)); max-height:calc(100vh - 32px); box-shadow:0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop{ background:rgba(10,25,22,.45); }
.dlg{ display:flex; flex-direction:column; max-height:calc(100vh - 32px); }
.dlg header{ padding:18px 22px 10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.dlg .body{ padding:6px 22px 18px; overflow:auto; display:flex; flex-direction:column; gap:14px; }
.dlg footer{ padding:14px 22px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
.dlg footer .spacer{ flex:1; }
.fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:13px; font-weight:600; color:var(--muted); }
.field input, .field select, .field textarea{ min-height:42px; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
.field textarea{ min-height:72px; resize:vertical; }
.field .hint{ font-size:12px; color:var(--muted); }
fieldset{ border:1px solid var(--line); border-radius:12px; padding:12px 14px 14px; margin:0; }
legend{ font-weight:600; padding:0 6px; font-size:14px; }
.pkrow{ display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr) 110px; gap:8px; margin-top:8px; }
.pkrow input{ min-height:40px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); width:100%; }
.rtrow, .rthead{ display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr) 110px 80px; gap:8px; margin-top:8px; }
.rtrow input{ min-height:40px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); width:100%; }
.rthead{ margin-top:4px; font-size:12px; font-weight:600; color:var(--muted); }
@media (max-width: 560px){ .rtrow, .rthead{ grid-template-columns: 1fr 1fr; } .rtrow input:nth-child(2){ grid-column:1 / -1; grid-row:2; } .rthead span:nth-child(2){ display:none; } }
.pkhead{ display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1.6fr) 110px; gap:8px; font-size:12px; font-weight:600; color:var(--muted); }
@media (max-width: 560px){ .pkrow, .pkhead{ grid-template-columns: 1fr 1fr; } .pkrow input:nth-child(2){ grid-column:1 / -1; grid-row:2; } .pkhead span:nth-child(2){ display:none; } }
.iconbtn{ width:44px; height:44px; border:0; background:transparent; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.iconbtn:hover{ background:var(--surface-2); }

.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; z-index:50; max-width:calc(100vw - 32px); }
.banner{ margin-bottom:16px; }
.backbtn{ display:inline-flex; align-items:center; gap:6px; background:none; border:0; color:var(--brand); font-weight:600; cursor:pointer; padding:6px 0; min-height:40px; margin-bottom:6px; }
.simtable td:first-child{ font-weight:600; }

/* Messages clients */
.flow{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
.flow .card{ padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
.flow .when{ font-size:13px; color:var(--brand); font-weight:600; }
.flow .what{ font-weight:600; }
.mailtabs{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 16px; }
.mailwrap{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
.envelope{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
.envelope .meta{ padding:14px 18px; border-bottom:1px solid var(--line); font-size:14px; display:grid; grid-template-columns:70px minmax(0,1fr); gap:4px 10px; }
.envelope .meta b{ color:var(--muted); font-weight:500; }
.envelope .subject{ font-weight:700; font-size:16px; }
.mailbody{ background:#EEF2F1; padding:22px 14px; }
.mail{ max-width:560px; margin:0 auto; background:#FFFFFF; color:#1C2B28; border-radius:12px; overflow:hidden; font-size:15px; line-height:1.55; }
.mail .top{ background:#0E3B35; color:#FFFFFF; padding:18px 24px; display:flex; align-items:baseline; gap:6px; }
.mail .top b{ font-size:22px; color:#7FD3C4; }
.mail .top span{ letter-spacing:2px; font-size:13px; font-weight:600; }
.mail .in{ padding:22px 24px; }
.mail h2{ font-size:20px; margin:0 0 10px; color:#0E3B35; }
.mail p{ margin:0 0 12px; }
.mail .box{ background:#F1F7F5; border-radius:10px; padding:14px 16px; margin:14px 0; }
.mail .box .r{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid #DCE8E4; }
.mail .box .r:last-child{ border-bottom:0; }
.mail .box .r span:first-child{ color:#4E6B65; }
.mail .box .r span:last-child{ text-align:right; font-weight:600; }
.mail .big{ font-size:22px; font-weight:700; color:#0E3B35; margin:0 0 4px; }
.mail .cta{ display:inline-block; background:#147566; color:#FFFFFF; text-decoration:none; padding:11px 18px; border-radius:8px; font-weight:600; margin:4px 0 12px; }
.mail ul{ margin:0 0 12px; padding-left:20px; }
.mail .alert{ background:#FCEFD9; color:#6B4000; border-radius:10px; padding:12px 14px; margin:12px 0; }
.mail .foot{ padding:16px 24px; background:#F6F8F7; color:#5A706B; font-size:12px; }
.phone{ max-width:340px; margin:0 auto; background:#FFFFFF; border-radius:22px; padding:18px 14px; border:1px solid #D8E3E0; }
.phone .from{ text-align:center; font-size:12px; color:#5A706B; margin-bottom:12px; }
.bubble{ background:#E9EDEC; color:#1C2B28; border-radius:16px 16px 16px 4px; padding:10px 13px; font-size:14px; line-height:1.45; }
.smscount{ text-align:center; font-size:12px; color:#5A706B; margin-top:10px; }
.sched{ display:flex; flex-direction:column; }
.sched .s{ display:grid; grid-template-columns: 150px minmax(0,1fr) auto; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); align-items:center; }
.sched .s:last-child{ border-bottom:0; }
@media (max-width:560px){ .sched .s{ grid-template-columns:1fr auto; } .sched .s span:first-child{ grid-column:1 / -1; } }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; min-height:38px; font-weight:500; cursor:pointer; font-size:14px; }
.chip[aria-pressed="true"]{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.chip .c{ opacity:.75; margin-left:6px; }
tr.click{ cursor:pointer; } tr.click:hover td{ background:var(--surface-2); }
.namebtn{ background:none; border:0; padding:0; font-weight:600; cursor:pointer; text-align:left; }
.camp .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:12px 0; }
.camp .stats div{ background:var(--surface-2); border-radius:10px; padding:10px 12px; }
.camp .stats b{ display:block; font-size:18px; }
.camp .stats span{ font-size:13px; color:var(--muted); }
.camp{ margin-bottom:14px; }
.check{ display:flex; gap:10px; align-items:flex-start; font-size:14px; }
.check input{ width:20px; height:20px; margin-top:1px; accent-color:var(--brand); flex-shrink:0; }
.mail .rate{ display:flex; gap:8px; margin:6px 0 10px; }
.mail .rate a{ width:40px; height:40px; border-radius:8px; background:#F1F7F5; color:#0E3B35; display:inline-flex; align-items:center; justify-content:center; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brandbox"><img id="logo" class="logo" src="https://www.lgdparis.com/images/lgd-paris-logo.jpeg" alt="LGD Paris"><div class="brandmark" id="wordmark" hidden><b>LGD</b><span>PARIS</span></div></div>
    <div class="brandsub">Pilotage des excursions</div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-nav="departs"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Départs</button>
      <button type="button" data-nav="reservations"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Réservations</button>
      <button type="button" data-nav="clients"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Clients</button>
      <button type="button" data-nav="campagnes"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>Campagnes</button>
      <button type="button" data-nav="excursions"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>Excursions</button>
      <button type="button" data-nav="messages"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>Messages clients</button>
      <button type="button" data-nav="pubs"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Publicités</button>
    </nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  'use strict';

  var TVA = 10; // TVA appliquée partout, choix LGD Paris
  var CONTACT_TEL = '01 42 37 95 40';
  var CONTACT_MAIL = 'contact@lgdparis.com';
  var CGV_URL = 'https://lgdparis.github.io/lgd-excursions/cgv-excursions/';
  var MAX_PK = 4;

  var S = {
    view: 'departs', depId: null,
    excursions: [], departures: [], bookings: [],
    clients: [], campaigns: [], prospects: [], prospectsOff: false,
    loaded: { excursions:false, departures:false, bookings:false, clients:false, campaigns:false },
    status: 'loading',
    canWrite: true, showPast: false,
    filter: { q:'', dep:'', status:'', source:'' },
    msg: { bookingId:'', type:'confirmation' },
    seg: 'voyage', cq: ''
  };
  var db = null, downloads = null;

  var SOURCES = ['Instagram','Facebook','TikTok','Google','Site direct','Téléphone','Autre'];
  var BSTATUS = { payee:'Payée', attente:'En attente', annulee:'Annulée', remboursee:'Remboursée' };
  var DSTATUS = { vente:'En vente', confirme:'Confirmé', annule:'Annulé', termine:'Terminé' };
  var MTYPES = [
    ['confirmation','Confirmation'], ['rappel','Rappel la veille'], ['sms','SMS de rappel'], ['annulation','Départ annulé'], ['avis','Demande d’avis']
  ];

  // ---------- Utilitaires ----------
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v, d){ var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : (d || 0); }
  var eur0 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
  var eur2 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2 });
  function money(n){ return eur0.format(Math.round(n)); }
  function money2(n){ return eur2.format(n); }
  function signed(n){ return (n > 0 ? '+' : '') + money(n); }
  function isoOf(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function todayISO(){ return isoOf(new Date()); }
  function parseDate(iso){ if(!iso) return null; var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(iso, n){ var d = parseDate(iso); if(!d) return null; d.setDate(d.getDate()+n); return isoOf(d); }
  function daysUntil(iso){ var d = parseDate(iso); if(!d) return null; return Math.round((d - parseDate(todayISO())) / 86400000); }
  function fmtDate(iso, opts){ var d = parseDate(iso); return d ? d.toLocaleDateString('fr-FR', opts || { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '—'; }
  function hhmm(t){ if(!t) return '—'; var p = t.split(':'); return p[0] + 'h' + (p[1] || '00'); }
  function plural(n, s, p){ return n + ' ' + (n > 1 ? (p || s + 's') : s); }
  function uid(){ return 'p' + Math.random().toString(36).slice(2, 8); }
  function ref(b){ return 'LGD-' + String(b.id || 'EXEMPLE').slice(0,6).toUpperCase(); }
  function firstName(n){ return String(n || '').trim().split(/\s+/)[0] || 'Bonjour'; }
  function mapsUrl(a){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a || ''); }
  // « dans la nuit du vendredi 11 au samedi 12 décembre, à 01h00 » ou « le samedi 12 décembre à 08h00 »
  function whenLabel(dateIso, time){
    var h = time ? parseInt(time.split(':')[0], 10) : 12;
    if(h < 5){
      var prev = parseDate(addDays(dateIso, -1)), d = parseDate(dateIso);
      if(!d) return hhmm(time);
      var p = prev.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric' });
      var c = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
      return 'dans la nuit du ' + p + ' au ' + c + ', à ' + hhmm(time);
    }
    return 'le ' + fmtDate(dateIso, { weekday:'long', day:'numeric', month:'long' }) + ' à ' + hhmm(time);
  }

  function exc(id){ for(var i=0;i<S.excursions.length;i++) if(S.excursions[i].id === id) return S.excursions[i]; return null; }
  function dep(id){ for(var i=0;i<S.departures.length;i++) if(S.departures[i].id === id) return S.departures[i]; return null; }
  function bk(id){ for(var i=0;i<S.bookings.length;i++) if(S.bookings[i].id === id) return S.bookings[i]; return null; }
  function bookingsOf(depId){ return S.bookings.filter(function(b){ return b.departureId === depId; }); }

  // Points de prise en charge : ceux du départ, sinon ceux de l'excursion
  function excPickups(e){
    if(!e) return [];
    if(e.pickups && e.pickups.length) return e.pickups;
    return [{ id:'p0', name: e.place || 'Point de départ', address:'', time: e.depTime || '' }];
  }
  function pickupsOf(d){
    if(d && d.pickups && d.pickups.length) return d.pickups;
    return excPickups(d ? exc(d.excursionId) : null);
  }
  function pickupOf(b){
    var d = dep(b.departureId), list = pickupsOf(d);
    for(var i=0;i<list.length;i++) if(list[i].id === b.pickupId) return list[i];
    return list[0] || { id:'', name:'Point à préciser', address:'', time:'' };
  }

  // ---------- Calculs ----------
  function costsOf(e, d){
    e = e || {};
    var km = num(e.km) + num(d && d.extraKm);
    var fuel = km * num(e.conso) / 100 * num(e.fuelPrice);
    var drivers = num(e.driverCost) * Math.max(1, num(e.drivers, 1));
    return { km: km, fuel: fuel, tolls: num(e.tolls), drivers: drivers, parking: num(e.parking), hotel: num(e.hotel), other: num(e.other),
      total: fuel + num(e.tolls) + drivers + num(e.parking) + num(e.hotel) + num(e.other) };
  }
  function adsOf(d){
    var a = d.ads || {};
    var spent = num(a.meta) + num(a.tiktok) + num(a.google) + num(a.other);
    return { spent: spent, planned: num(d.adsPlanned), used: spent > 0 ? spent : num(d.adsPlanned), isPlanned: !(spent > 0) };
  }
  function stats(d){
    var e = exc(d.excursionId) || {};
    var price = num(e.price), priceHT = price / (1 + TVA/100);
    var bs = bookingsOf(d.id);
    var paid = bs.filter(function(b){ return b.status === 'payee'; });
    var pending = bs.filter(function(b){ return b.status === 'attente'; });
    var pax = paid.reduce(function(s,b){ return s + num(b.qty); }, 0);
    var paxPending = pending.reduce(function(s,b){ return s + num(b.qty); }, 0);
    var caTTC = paid.reduce(function(s,b){ return s + num(b.amount); }, 0);
    var caHT = caTTC / (1 + TVA/100);
    var fc = costsOf(e, d), ads = adsOf(d);
    var costs = fc.total + ads.used, result = caHT - costs;
    var cap = num(d.capacity) || num(e.capacity) || 55;
    var be = priceHT > 0 ? Math.ceil(costs / priceHT) : 0;
    var minPax = num(d.minPax) || be;
    var dd = daysUntil(d.decisionDate), days = daysUntil(d.date);
    var st;
    if(d.status === 'annule') st = { key:'neutral', label:'Annulé' };
    else if(d.status === 'termine' || (days != null && days < 0)) st = { key:'neutral', label:'Terminé' };
    else if(pax >= cap) st = { key:'ok', label:'Complet' };
    else if(result >= 0) st = { key:'ok', label:'Rentable' };
    else if(dd != null && dd <= 3 && pax < minPax) st = { key:'risk', label: dd < 0 ? 'Décision dépassée' : 'À décider' };
    else st = { key:'warn', label:'Sous le seuil' };
    return { e:e, price:price, priceHT:priceHT, pax:pax, paxPending:paxPending, caTTC:caTTC, caHT:caHT, fc:fc, ads:ads, costs:costs, result:result, cap:cap, be:be, minPax:minPax, missing:Math.max(0, be - pax), dd:dd, days:days, st:st, count:paid.length, paid:paid };
  }

  function seatsHTML(pax, cap, be, big){
    cap = Math.max(1, Math.min(120, Math.round(cap)));
    var h = '<div class="seats' + (big ? ' big' : '') + '" role="img" aria-label="' + esc(pax + ' places vendues sur ' + cap + ', seuil de rentabilité à ' + be + ' passagers') + '"' + (big ? '' : ' style="grid-template-columns:repeat(' + cap + ',minmax(0,1fr))"') + '>';
    for(var i=1;i<=cap;i++) h += '<span class="seat' + (i <= pax ? ' full' : '') + (i === be && be > 0 && be <= cap ? ' be' : '') + '"></span>';
    return h + '</div>';
  }
  function pill(st){ return '<span class="pill ' + st.key + '">' + esc(st.label) + '</span>'; }
  function bpill(st){ var k = st === 'payee' ? 'ok' : st === 'attente' ? 'warn' : st === 'annulee' ? 'risk' : 'neutral'; return '<span class="pill ' + k + '">' + esc(BSTATUS[st] || st || '—') + '</span>'; }

  // ---------- Base de données ----------
  function col(name){ return db.collection(name); }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2800); }
  function writeErr(e){
    var code = e && e.code;
    if(code === 'invalid_argument'){ S.canWrite = false; render(); toast('Vous n’avez pas le droit de modifier ces données.'); }
    else if(code === 'quota_exceeded') toast('Base pleine : supprimez d’anciennes données pour continuer.');
    else toast('L’enregistrement a échoué. Réessayez dans un instant.');
  }
  function saveDoc(name, id, data){ if(!db) return Promise.reject({ code:'unavailable' }); var r = id ? col(name).doc(id) : col(name).doc(); return r.set(data).then(function(){ return r.id; }); }
  function delDoc(name, id){ return col(name).doc(id).delete(); }
  // Prospects intéressés (formulaire « Être prévenu » du site, 25/11/2026) : chargés à part,
  // une erreur de lecture n'empêche jamais l'outil de fonctionner.
  function subscribeProspects(){
    try{
      col('prospects').onSnapshot(function(snap){
        S.prospects = snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); }); S.prospectsOff = false;
        if(S.status === 'ready') render();
      }, function(){ S.prospects = []; S.prospectsOff = true; if(S.status === 'ready') render(); });
    }catch(e){ S.prospectsOff = true; }
  }
  function subscribe(name){
    col(name).onSnapshot(function(snap){
      try{
        S[name] = snap.docs.map(function(d){ return Object.assign({}, d.data() || {}, { id: d.id }); });
        S.loaded[name] = true;
        if(Object.keys(S.loaded).every(function(k){ return S.loaded[k]; }) && S.status === 'loading'){ S.status = 'ready'; clearTimeout(boot._timer); }
        if(S.status === 'ready') render();
      }catch(err){ console.error(err); S.status = 'error'; render(); }
    }, function(err){ clearTimeout(boot._timer); S.status = (err && err.code === 'revoked') ? 'nodb' : (err && err.code === 'permission-denied') ? 'denied' : 'error'; render(); });
  }
  // Logo : si l'image ne charge pas (aperçu claude.ai), on affiche le nom en texte
  (function(){
    var lg = document.getElementById('logo'), wm = document.getElementById('wordmark');
    function fallback(){ lg.style.display = 'none'; wm.hidden = false; }
    lg.addEventListener('error', fallback);
    if(lg.complete && !lg.naturalWidth) fallback();
  })();

  var IS_ARTIFACT = !!(window.claude && window.claude.use);
  var IS_PROD = !IS_ARTIFACT && !!window.LGD_CONFIG;
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  function loadScript(src){ return new Promise(function(res, rej){ var el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = function(){ rej(new Error(src)); }; document.head.appendChild(el); }); }
  function browserSave(o){
    try{
      var blob = new Blob([o.data], { type:'text/csv;charset=utf-8' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return Promise.resolve({ status:'saved' });
    }catch(e){ return Promise.reject({ code:'unavailable' }); }
  }
  function boot(){
    if(IS_ARTIFACT) return bootArtifact();
    if(IS_PROD) return bootFirebase();
    S.status = 'noconfig'; render();
  }
  function bootFirebase(){
    S.status = 'loading'; render();
    loadScript(FB + 'firebase-app-compat.js').then(function(){
      return Promise.all([loadScript(FB + 'firebase-auth-compat.js'), loadScript(FB + 'firebase-firestore-compat.js')]);
    }).then(function(){
      firebase.initializeApp(window.LGD_CONFIG.firebase);
      downloads = { save: browserSave };
      firebase.auth().onAuthStateChanged(function(u){
        if(!u){ S.status = 'login'; S.user = null; render(); return; }
        S.user = u.email || '';
        db = firebase.firestore();
        S.status = 'loading'; render();
        boot._timer = setTimeout(function(){ if(S.status === 'loading'){ S.status = 'error'; render(); } }, 15000);
        ['excursions','departures','bookings','clients','campaigns'].forEach(subscribe); subscribeProspects();
      });
    }).catch(function(){ S.status = 'error'; render(); });
  }
  function bootArtifact(){
    render();
    boot._timer = setTimeout(function(){ if(S.status === 'loading'){ S.status = 'error'; render(); } }, 10000);
    if(!window.claude || !window.claude.use){ S.status = 'nodb'; clearTimeout(boot._timer); render(); return; }
    window.claude.use('db').then(function(d){
      if(!d){ S.status = 'nodb'; clearTimeout(boot._timer); render(); return; }
      db = d; ['excursions','departures','bookings','clients','campaigns'].forEach(subscribe); subscribeProspects();
    }).catch(function(){ S.status = 'nodb'; clearTimeout(boot._timer); render(); });
    window.claude.use('downloads').then(function(d){ downloads = d; if(S.status === 'ready') render(); }).catch(function(){});
    window.claude.use('user').then(function(u){ if(u && u.can) Promise.resolve(u.can('data.write')).then(function(v){ if(v === false){ S.canWrite = false; render(); } }); }).catch(function(){});
  }

  // ---------- Rendu ----------
  var main = document.getElementById('main');
  function dis(){ return S.canWrite ? '' : ' disabled'; }
  function render(){
    try{ renderInner(); }catch(err){ console.error(err); main.innerHTML = '<div class="card empty"><h2>Un affichage a échoué</h2><p class="muted">Rechargez la page. Si le problème revient, signalez ce que vous faisiez juste avant.</p></div>'; }
  }
  function renderInner(){
    var navView = S.view === 'depart' ? 'departs' : S.view;
    document.querySelectorAll('[data-nav]').forEach(function(b){ if(b.getAttribute('data-nav') === navView && b.closest('.nav')) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    var hasDemo = S.departures.some(function(d){ return d.demo; });
    var foot = '';
    var cgvLink = '<a class="linkbtn" href="' + CGV_URL + '" target="_blank" rel="noopener">CGV Excursions</a>';
    if(IS_PROD && S.user) foot = cgvLink + '<span>' + esc(S.user) + '</span><button type="button" class="linkbtn" data-act="logout">Se déconnecter</button>';
    else if(!IS_PROD && S.status === 'ready' && S.canWrite) foot = hasDemo ? '<button type="button" class="linkbtn" data-act="demo-clear">Effacer les données de démo</button>' : '<button type="button" class="linkbtn" data-act="demo-load">Charger une démo</button>';
    document.getElementById('sidefoot').innerHTML = foot;
    if(S.status === 'login'){ main.innerHTML = viewLogin(); var le = document.getElementById('f_email'); if(le) le.focus(); return; }
    if(S.status === 'denied'){ main.innerHTML = '<div class="card empty"><h2>Accès non autorisé</h2><p class="muted">Le compte ' + esc(S.user || '') + ' n’est pas dans la liste des associés. Demandez à votre développeur de l’ajouter.</p><button type="button" class="btn" data-act="logout">Se déconnecter</button></div>'; return; }
    if(S.status === 'noconfig'){ main.innerHTML = '<div class="card empty"><h2>Configuration manquante</h2><p class="muted">Le fichier config.js est introuvable. Voir le guide d’installation (README-DEVELOPPEUR.md).</p></div>'; return; }
    if(S.status === 'loading'){ main.innerHTML = '<div class="card empty"><p class="muted">Chargement des données…</p></div>'; return; }
    if(S.status === 'nodb'){ main.innerHTML = '<div class="card empty"><h2>Données inaccessibles</h2><p class="muted">Ouvrez l’outil depuis claude.ai en étant connecté avec un compte qui a accès à cet artifact.</p></div>'; return; }
    if(S.status === 'error'){ main.innerHTML = '<div class="card empty"><h2>Les données n’ont pas pu être chargées</h2><p class="muted">Rechargez la page. Si le problème continue, vérifiez votre connexion.</p></div>'; return; }
    var banner = S.canWrite ? '' : '<div class="note warn banner">Lecture seule : votre accès ne permet pas de modifier les données.</div>';
    var h;
    if(S.view === 'depart' && dep(S.depId)) h = viewDeparture(dep(S.depId));
    else if(S.view === 'reservations') h = viewBookings();
    else if(S.view === 'excursions') h = viewExcursions();
    else if(S.view === 'messages') h = viewMessages();
    else if(S.view === 'pubs') h = viewAds();
    else if(S.view === 'clients') h = viewClients();
    else if(S.view === 'campagnes') h = viewCampaigns();
    else { if(S.view !== 'depart') S.view = 'departs'; h = viewDepartures(); }
    main.innerHTML = banner + h;
  }
  function viewLogin(){
    return '<div class="card pad" style="max-width:420px;margin:8vh auto 0"><h1 style="margin-bottom:6px">Connexion</h1><p class="muted" style="margin:0 0 16px">Espace réservé aux associés de LGD Paris.</p>' +
      '<form id="login-form" novalidate style="display:flex;flex-direction:column;gap:12px">' + fld('E-mail', 'email', '', 'email', ' autocomplete="username" required') + fld('Mot de passe', 'password', '', 'password', ' autocomplete="current-password" required') +
      '<p id="login-err" class="note risk" hidden></p><button type="submit" class="btn primary">Se connecter</button><button type="button" class="linkbtn" data-act="reset-pwd" style="align-self:center">Mot de passe oublié</button></form></div>';
  }
  function kpi(v, l){ return '<div class="card kpi"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div></div>'; }
  function line(l, v){ return '<div class="line"><span>' + esc(l) + '</span><span>' + v + '</span></div>'; }

  // --- Départs ---
  function viewDepartures(){
    var all = S.departures.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    var upcoming = all.filter(function(d){ var n = daysUntil(d.date); return n == null || n >= 0; });
    var past = all.filter(function(d){ var n = daysUntil(d.date); return n != null && n < 0; }).reverse();
    var live = upcoming.filter(function(d){ return d.status !== 'annule'; });
    var tot = live.reduce(function(a, d){ var s = stats(d); a.pax += s.pax; a.ca += s.caTTC; a.res += s.result; a.risk += (s.st.key === 'risk' ? 1 : 0); return a; }, { pax:0, ca:0, res:0, risk:0 });
    var h = '<div class="head"><div><h1>Départs</h1><p class="muted">Remplissage et rentabilité de chaque départ.</p></div><div class="row"><button type="button" class="btn primary" data-act="dep-new"' + dis() + '>Nouveau départ</button></div></div>';
    h += planBanner();
    if(!S.excursions.length) return h + '<div class="card empty"><h2>Créez d’abord vos excursions</h2><p class="muted">Une excursion contient le prix, les points de prise en charge et les coûts. Chaque départ s’appuie dessus pour calculer sa rentabilité.</p><button type="button" class="btn primary" data-act="seed"' + dis() + '>Créer Amsterdam, Bruges et Strasbourg</button></div>';
    h += '<div class="kpis">' + kpi(live.length, 'départs à venir') + kpi(tot.pax, 'passagers vendus') + kpi(money(tot.ca), 'encaissé TTC') + kpi('<span class="' + (tot.res >= 0 ? 'pos' : 'neg') + '">' + signed(tot.res) + '</span>', 'résultat HT si les départs partaient aujourd’hui') + '</div>';
    if(tot.risk) h += '<div class="note risk banner">' + plural(tot.risk, 'départ') + ' sous le seuil avec une date de décision proche. Relancez la pub ou décidez de maintenir ou d’annuler.</div>';
    h += upcoming.length ? '<div class="deps">' + upcoming.map(depRow).join('') + '</div>' : '<div class="card empty"><h2>Aucun départ à venir</h2><p class="muted">Programmez une date pour une de vos excursions pour commencer à suivre les ventes.</p><button type="button" class="btn primary" data-act="dep-new"' + dis() + '>Nouveau départ</button></div>';
    if(past.length){
      h += '<div style="margin-top:22px"><button type="button" class="linkbtn" data-act="toggle-past">' + (S.showPast ? 'Masquer' : 'Afficher') + ' les départs passés (' + past.length + ')</button></div>';
      if(S.showPast) h += '<div class="deps" style="margin-top:10px">' + past.map(depRow).join('') + '</div>';
    }

  // --- Réservations ---

    }).sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });

      '<select id="f-status" aria-label="Statut"><option value="">Tous les statuts</option>' + Object.keys(BSTATUS).map(function(k){ return '<option value="' + k + '"' + (f.status === k ? ' selected' : '') + '>' + BSTATUS[k] + '</option>'; }).join('') + '</select>' +
      '<select id="f-source" aria-label="Source"><option value="">Toutes les sources</option>' + SOURCES.map(function(x){ return '<option' + (f.source === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></div>';
    if(!list.length) return h + '<div class="card empty"><p class="muted">' + (S.bookings.length ? 'Aucune réservation ne correspond à ces filtres.' : 'Pas encore de réservation. Ajoutez-en une depuis un départ ou avec le bouton ci-dessus.') + '</p></div>';

      list.map(function(b){ var d = dep(b.departureId) || {}; var e = exc(d.excursionId) || {}; var p = pickupOf(b); return '<tr><td><strong>' + esc(b.name) + '</strong><div class="muted small">' + esc(b.phone || b.email || '') + '</div></td><td>' + esc(e.name || '—') + '<div class="muted small">' + esc(fmtDate(d.date, { day:'numeric', month:'short', year:'numeric' })) + '</div></td><td>' + esc(p.name) + '<div class="muted small">' + esc(hhmm(p.time)) + '</div></td><td class="num">' + num(b.qty) + '</td><td class="num">' + money2(num(b.amount)) + '</td><td>' + bpill(b.status) + '</td><td>' + esc(b.source || '—') + '</td><td><div class="row" style="flex-wrap:nowrap;gap:6px"><button type="button" class="btn small" data-act="bk-msg" data-id="' + esc(b.id) + '">Messages</button><button type="button" class="btn small" data-act="bk-edit" data-id="' + esc(b.id) + '"' + dis() + '>Modifier</button></div></td></tr>'; }).join('') +

  // --- Base clients ---
  function normKey(b){ var k = String(b.email || '').trim().toLowerCase(); if(!k) k = String(b.phone || '').replace(/\D/g,''); if(!k) k = String(b.name || '').trim().toLowerCase(); return k; }
  function clientDocId(k){ return 'c_' + String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,150); }
  function crec(id){ for(var i=0;i<S.clients.length;i++) if(S.clients[i].id === id) return S.clients[i]; return null; }
  function buildClients(){
    var map = {};
    S.bookings.forEach(function(b){
      if(b.status !== 'payee' || b.anonymized) return;
      var d = dep(b.departureId); if(!d || d.status === 'annule') return;
      var k = normKey(b); if(!k) return;
      var id = clientDocId(k);
      var c = map[id] || (map[id] = { id:id, key:k, name:'', email:'', phone:'', bookings:[], traveled:0, upcoming:0, spent:0, pax:0, lastTrip:'', firstAt:'', firstSource:'', dests:{}, optOutBk:false, latest:'' });
      c.bookings.push(b);
      if(!c.firstAt || (b.createdAt||'') < c.firstAt){ c.firstAt = b.createdAt || ''; c.firstSource = b.source || ''; }
      if((b.createdAt||'') >= c.latest){ c.latest = b.createdAt || ''; c.name = b.name; if(b.email) c.email = b.email; if(b.phone) c.phone = b.phone; }
      if(!c.email && b.email) c.email = b.email;
      if(!c.phone && b.phone) c.phone = b.phone;
      if(b.optOut) c.optOutBk = true;
      c.spent += num(b.amount); c.pax += num(b.qty);
      var n = daysUntil(d.date);
      if(n != null && n <= -1){ c.traveled++; if(d.date > c.lastTrip) c.lastTrip = d.date; var e = exc(d.excursionId); if(e) c.dests[e.id] = e.name; }
      else c.upcoming++;
    });
    S.prospects.forEach(function(p){
      var k = String(p.email || '').trim().toLowerCase(); if(!k) return;
      var id = clientDocId(k);
      var c = map[id] || (map[id] = { id:id, key:k, name:((p.prenom||'') + ' ' + (p.nom||'')).trim(), email:p.email, phone:p.telephone||'', bookings:[], traveled:0, upcoming:0, spent:0, pax:0, lastTrip:'', firstAt:p.createdAt||'', firstSource:p.source||'Site – Être prévenu', dests:{}, optOutBk:false, latest:p.updatedAt||'' });
      c.prospect = p; c.interets = p.interets || []; c.interetsSlugs = p.excursions || [];
      if(!c.phone && p.telephone) c.phone = p.telephone;
    });
    return Object.keys(map).map(function(id){
      var c = map[id], r = crec(id) || {};
      c.isClient = c.bookings.length > 0; c.interets = c.interets || []; c.interetsSlugs = c.interetsSlugs || [];
      c.rec = r; c.optOutEmail = !!r.optOutEmail || c.optOutBk; c.optOutSms = !!r.optOutSms || c.optOutBk;
      c.satisfaction = num(r.satisfaction);
      c.lastActivity = c.lastTrip || String(c.latest || '').slice(0,10);
      c.sinceLast = c.lastTrip ? -daysUntil(c.lastTrip) : null;
      c.old = !!c.lastActivity && daysUntil(c.lastActivity) < -1095;
      c.isDemo = c.bookings.some(function(b){ return b.demo; });
      return c;
    }).sort(function(a,b){ return (b.lastActivity||'').localeCompare(a.lastActivity||''); });
  }
  function segments(){
    var list = [
      ['voyage','Ont voyagé', function(c){ return c.traveled >= 1; }],
      ['fideles','Fidèles (2 excursions ou plus)', function(c){ return c.traveled >= 2; }],
      ['avenir','Pas encore partis', function(c){ return c.isClient && c.traveled === 0; }],
      ['inactifs','Sans voyage depuis 6 mois', function(c){ return c.traveled >= 1 && c.sinceLast > 180; }],
      ['satisfaits','Très satisfaits (4 ou 5 sur 5)', function(c){ return c.satisfaction >= 4; }]
    ];
    S.excursions.forEach(function(e){ list.push(['dest:' + e.id, 'Déjà allés à ' + e.name, function(c){ return !!c.dests[e.id]; }]); });
    list.push(['tous','Tous les clients', function(c){ return c.isClient; }]);
    list.push(['prospects','Prospects intéressés (tous)', function(c){ return !!c.prospect; }]);
    Object.keys(PROSPECT_LABELS).forEach(function(k){ list.push(['pi:' + k, 'Prospects intéressés : ' + PROSPECT_LABELS[k], function(c){ return c.interetsSlugs.indexOf(k) >= 0; }]); });
    return list;
  }
  var PROSPECT_LABELS = { 'mont-saint-michel':'Mont Saint-Michel', 'honfleur-etretat':'Honfleur & Étretat', 'love-and-trip':'Love & Trip', 'chateaux-loire':'Châteaux de la Loire', 'plages-normandie':'Plages de Normandie', 'gourmet-city-tour':'Gourmet City Tour', 'strasbourg':'Strasbourg', 'bruges':'Bruges', 'amsterdam':'Amsterdam', 'autres':'Autres idées' };
  function segOf(id){ return segments().filter(function(x){ return x[0] === id; })[0] || segments()[0]; }
  function segFn(id){ return segOf(id)[2]; }
  function segLabel(id){ return segOf(id)[1]; }
  function reachable(list, channel){ return list.filter(function(c){ return channel === 'sms' ? (c.phone && !c.optOutSms) : (c.email && !c.optOutEmail); }); }

  function viewClients(){

    var nProsp = all.filter(function(c){ return c.prospect && !c.isClient; }).length;
    h += '<div class="kpis">' + kpi(nProsp, 'prospects intéressés') + kpi(traveled.length, 'clients ayant voyagé') + kpi(mailable.length, 'joignables par e-mail') + kpi(fid.length, 'clients fidèles') + kpi(traveled.length ? money(traveled.reduce(function(s,c){ return s + c.spent; }, 0) / traveled.length) : '—', 'dépensé en moyenne par client') + '</div>';
    if(S.prospectsOff) h += '<div class="note warn banner">Les prospects intéressés (formulaire « Être prévenu » du site) ne peuvent pas être lus : autorisez la lecture de la collection « prospects » dans les règles Firestore.</div>';
    if(olds.length) h += '<div class="note warn banner">' + plural(olds.length, 'client') + ' sans activité depuis plus de 3 ans : la CNIL recommande d’effacer leurs données (bouton « Effacer ses données » dans la fiche).</div>';
    if(!all.length) return h + '<div class="card empty"><p class="muted">La base est vide pour l’instant. Les clients apparaîtront ici après leur première excursion. Chargez la démo pour voir un exemple.</p></div>';
    h += '<div class="chips" role="group" aria-label="Segments">' + segments().map(function(s){ var n = all.filter(s[2]).length; if(!n && s[0].indexOf('pi:') === 0 && S.seg !== s[0]) return ''; return '<button type="button" class="chip" data-act="seg" data-seg="' + esc(s[0]) + '" aria-pressed="' + (S.seg === s[0]) + '">' + esc(s[1]) + '<span class="c">' + n + '</span></button>'; }).join('') + '</div>';
    var q = S.cq.trim().toLowerCase();
    var list = all.filter(segFn(S.seg)).filter(function(c){ return !q || (c.name + ' ' + c.email + ' ' + c.phone).toLowerCase().indexOf(q) >= 0; });
    h += '<div class="filters" role="search"><input type="search" id="c-q" placeholder="Rechercher un client" aria-label="Rechercher un client" value="' + esc(S.cq) + '"></div>';
    if(!list.length) return h + '<div class="card empty"><p class="muted">Aucun client dans ce segment.</p></div>';
    return h + '<div class="card tablewrap"><table><thead><tr><th>Client</th><th>Excursions faites</th><th class="num">Dépensé</th><th>Dernier voyage</th><th>Venu par</th><th>Satisfaction</th><th>Offres</th></tr></thead><tbody>' +
      list.map(function(c){

        if(x.type === 'exc'){ created[x.pl.ex] = Object.assign({ id: x.pl.ex }, SEED[x.pl.ex]); return saveDoc('excursions', x.pl.ex, Object.assign({}, SEED[x.pl.ex], { updatedAt: new Date().toISOString() })); }
        if(x.type === 'addr'){
          var ue = Object.assign({}, x.e, { pickups: fixPks(excPickups(x.e)), updatedAt: new Date().toISOString() }); delete ue.id;
          var lines = String(ue.practical || '').split('\n').filter(function(l){ return l.trim(); });
          lines = lines.filter(function(l){ return !/stationnement facile|parking gratuit|accueil au 1er/i.test(l); }); lines.unshift(PARKING);
          ue.practical = lines.join('\n'); created[x.pl.ex] = Object.assign({ id: x.e.id }, ue);
          return saveDoc('excursions', x.e.id, ue);
        }

          return saveDoc('departures', x.dep.id, ud);
        }
        var e = created[x.pl.ex] || planExc(x.pl.ex);
        if(x.type === 'move'){
          var upd = Object.assign({}, x.dep, { pickups: fixPks(x.dep.pickups), date: x.pl.date, decisionDate: addDays(x.pl.date, -10), status:'vente', launch:true, updatedAt: new Date().toISOString() }); delete upd.id;
          n++; return saveDoc('departures', x.dep.id, upd);
        }
        var pks = fixPks(excPickups(e)).map(function(p){ return { id:p.id, name:p.name, address:p.address || '', time:p.time || '' }; });
        n++; return saveDoc('departures', null, { excursionId: e.id, date: x.pl.date, status:'vente', capacity:null, pickups: pks, extraKm:0, vehicle:'Autocar 55 places', driversNames:'', minPax:null, decisionDate: addDays(x.pl.date, -10), adsPlanned: num(e.adsBudget), ads:{ meta:0, tiktok:0, google:0, other:0 }, notes:'', demo:false, launch:true, updatedAt: new Date().toISOString() });
      });
    });
    chain.then(function(){ S.view = 'departs'; render(); toast((gone ? 'Remise à zéro faite. ' : '') + 'Programme de décembre en place : ' + plural(n, 'départ') + ' en vente'); }).catch(writeErr);
  }

      if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) m = 'E-mail ou mot de passe incorrect. Vérifiez le compte dans Firebase, Authentication, onglet Utilisateurs.';
      else if(/invalid-email/.test(c)) m = 'Cette adresse e-mail n’est pas valide.';
      else if(/unauthorized-domain/.test(c)) m = 'Cette adresse (' + host + ') n’est pas autorisée dans Firebase : ajoutez « ' + host + ' » dans Authentication, Paramètres, Domaines autorisés.';
      else if(/operation-not-allowed|configuration-not-found/.test(c)) m = 'La connexion par e-mail n’est pas activée dans Firebase : Authentication, Méthode de connexion, activez « Adresse e-mail/Mot de passe ».';
      else if(/api-key/.test(c)) m = 'La clé « apiKey » du fichier config.js est incorrecte : recopiez-la depuis Firebase, Paramètres du projet.';
      else if(/too-many-requests/.test(c)) m = 'Trop de tentatives. Réessayez dans quelques minutes, ou utilisez « Mot de passe oublié ».';
      else if(/network/.test(c)) m = 'Pas de connexion internet. Vérifiez votre réseau et réessayez.';
      else m = 'Connexion impossible (' + (c || 'erreur inconnue') + '). Envoyez ce message à Claude pour diagnostic.';
      er.textContent = m; er.hidden = false;
    });
  });
  main.addEventListener('change', function(ev){
    if(ev.target.id === 'f-dep'){ S.filter.dep = ev.target.value; render(); }
    if(ev.target.id === 'f-status'){ S.filter.status = ev.target.value; render(); }
    if(ev.target.id === 'f-source'){ S.filter.source = ev.target.value; render(); }
    if(ev.target.id === 'm-bk'){ S.msg.bookingId = ev.target.value; render(); }
  });

  boot();
})();
</script>
</body>
</html>
